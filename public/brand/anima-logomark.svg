<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28" role="img" aria-label="Anima">
  <title>Anima mark</title>
  <!-- The fill is a literal presentation attribute, so design tools and print
       always get brand violet. The rule below only overrides it in dark mode,
       where near-black would vanish against a dark browser tab strip; CSS wins
       over a presentation attribute, and tools that ignore <style> simply keep
       the violet. Avoid CSS variables here — a tool without var() support
       would render the mark with no fill at all. -->
  <style>
    @media (prefers-color-scheme: dark) { .mark { fill: #F5FF63; } }
  </style>
  <g class="mark" fill="#17082C">
      <rect x="2" y="9" width="7" height="10" rx="3.5" opacity=".35"/>
      <rect x="10.5" y="5" width="7" height="18" rx="3.5" opacity=".65"/>
      <rect x="19" y="11" width="7" height="6" rx="3"/>
  </g>
</svg>
