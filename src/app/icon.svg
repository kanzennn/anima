<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <!-- The studio mark from the navbar: three offset bars easing into place.
       Brand violet on light tab strips; the lime treatment the mark already
       uses on dark sections of the site takes over in dark mode. -->
  <style>
    svg { --mark: #17082C; }
    @media (prefers-color-scheme: dark) { svg { --mark: #F5FF63; } }
  </style>
  <g fill="var(--mark)">
    <rect x="2" y="9" width="7" height="10" rx="3.5" opacity=".35" />
    <rect x="10.5" y="5" width="7" height="18" rx="3.5" opacity=".65" />
    <rect x="19" y="11" width="7" height="6" rx="3" />
  </g>
</svg>
